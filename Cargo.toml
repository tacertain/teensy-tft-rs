[package]
name = "teensy-tft-rs"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Embedded Rust library for TFT displays on Teensy 4.1"
repository = "https://github.com/yourusername/teensy-tft-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "teensy", "tft", "display", "graphics"]
categories = ["embedded", "hardware-support"]

[dependencies]
# Core embedded dependencies
cortex-m = "0.7"
embedded-hal = "0.2"
nb = "1.0"
panic-halt = "0.2"

# Teensy 4.x specific (assuming Teensy 4.0/4.1)
teensy4-bsp = { version = "0.5", features = ["rt"] }
teensy4-panic = "0.2"

# Display and graphics
embedded-graphics = "0.8"
display-interface = "0.4"
display-interface-spi = "0.4"
ili9341 = "0.5"

# Async and futures for DMA
futures = { version = "0.3", default-features = false }
pin-utils = "0.1"

[dependencies.heapless]
version = "0.8"
default-features = false

[[bin]]
name = "main"
test = false
bench = false

[[bin]]
name = "main_dma"
test = false
bench = false

[profile.release]
debug = true
lto = true
opt-level = "s"

[profile.dev]
debug = true
opt-level = 1
